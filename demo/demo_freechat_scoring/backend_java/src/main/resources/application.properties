server.port=8000

# DashScope / Bailian Configuration
dashscope.api.key=${DASHSCOPE_API_KEY:}
bailian.workspace.id=${BAILIAN_WORKSPACE_ID:}
bailian.model=${BAILIAN_MODEL:qwen3.5-omni-plus-realtime}
qwen.scoring.model=${QWEN_SCORING_MODEL:qwen-plus}
qwen.ielts.judge.model=${QWEN_IELTS_JUDGE_MODEL:qwen-plus}
qwen.compatible.endpoint=${QWEN_COMPATIBLE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
ielts.prompt.version=${IELTS_PROMPT_VERSION:ielts-2026-07-21.1}
ielts.prompt.examiner-resource=${IELTS_EXAMINER_PROMPT_RESOURCE:classpath:prompts/ielts/examiner-system.txt}
ielts.prompt.language-resource=${IELTS_LANGUAGE_PROMPT_RESOURCE:classpath:prompts/ielts/language-evidence.txt}
ielts.prompt.judge-resource=${IELTS_JUDGE_PROMPT_RESOURCE:classpath:prompts/ielts/judge.txt}

# iFlytek ISE Configuration
xfyun.appid=${XFYUN_APPID:}
xfyun.apikey=${XFYUN_APIKEY:}
xfyun.apisecret=${XFYUN_APISECRET:}
xfyun.ielts.mode=${XFYUN_IELTS_MODE:read_sentence}
