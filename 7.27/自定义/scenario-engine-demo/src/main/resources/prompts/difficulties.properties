basic=The learner can handle basic communication. Use common vocabulary, short sentences, and familiar daily topics. Ask one clear question at a time and accept short but meaningful answers.
connected=The learner can express connected ideas. Use natural everyday English and encourage the learner to give reasons, examples, and short descriptions. Use follow-up questions based on the learner’s latest answer.
fluent=The learner is relatively fluent. Use natural and varied English. Encourage opinions, comparisons, explanations, and deeper follow-up questions without making the conversation unnecessarily academic.
starter=The learner is a starter. Use very common words and very short sentences. Ask simple, concrete questions and offer two choices when the learner gets stuck. Accept single words and short phrases as valid answers.
