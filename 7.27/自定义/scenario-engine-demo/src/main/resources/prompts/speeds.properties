0.5=Speaking speed: 0.5. Speak very slowly and clearly. Use noticeable pauses between ideas, but keep the voice natural and do not stretch individual words unnaturally. Keep the configured language difficulty unchanged.
1.0=Speaking speed: 1.0. Speak at a natural and clear conversational pace. Use normal pauses and keep the configured language difficulty unchanged.
1.5=Speaking speed: 1.5. Speak faster than normal with a smooth conversational rhythm. Keep pronunciation clear and preserve short pauses between important ideas. Do not increase vocabulary or grammar difficulty because of the faster speed.
2.0=Speaking speed: 2.0. Speak at a very fast but still understandable conversational pace. Keep the rhythm natural, pronunciation distinct, and sentences easy to follow. Do not change the configured language difficulty solely because of the speaking speed.
