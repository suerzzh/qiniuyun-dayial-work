spring:
  application:
    name: scenario-engine-demo
  config:
    import: optional:file:${UNISPEAKING_ENV_FILE:.env}[.properties]
server:
  port: ${SERVER_PORT:8081}

demo:
  qwen:
    endpoint: ${QWEN_COMPATIBLE_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    api-key: ${DASHSCOPE_API_KEY:}
    extractor-model: ${SCENARIO_EXTRACTOR_MODEL:qwen3.5-flash}
    generator-model: ${SCENARIO_GENERATOR_MODEL:qwen-plus}
  realtime:
    endpoint: ${QWEN_REALTIME_ENDPOINT:}
    workspace-id: ${BAILIAN_WORKSPACE_ID:}
    region: ${QWEN_REALTIME_REGION:cn-beijing}
    model: ${BAILIAN_MODEL:qwen3.5-omni-plus-realtime}
    voice-override: ${QWEN_REALTIME_VOICE:}
    coach-voices:
      clara: ${QWEN_VOICE_CLARA:Serena}
      james: ${QWEN_VOICE_JAMES:Raymond}
      leo: ${QWEN_VOICE_LEO:Ryan}
      david: ${QWEN_VOICE_DAVID:Andre}
      emily: ${QWEN_VOICE_EMILY:Mione}
      arthur: ${QWEN_VOICE_ARTHUR:Harvey}
    transcription-model: ${QWEN_TRANSCRIPTION_MODEL:qwen3-asr-flash-realtime}
    vad-type: ${QWEN_VAD_TYPE:semantic_vad}
  prompts:
    defaults:
      coach: ${PROMPT_DEFAULT_COACH:clara}
      difficulty: ${PROMPT_DEFAULT_DIFFICULTY:basic}
      speed: ${PROMPT_DEFAULT_SPEED:1.0}
      correction: ${PROMPT_DEFAULT_CORRECTION:moderate}
