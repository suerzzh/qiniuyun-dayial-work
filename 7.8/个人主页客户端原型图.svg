  <text x="80" y="132" fill="#171821" font-family="Inter, PingFang SC, Microsoft YaHei, Arial" font-size="44" font-weight="820">个人主页</text>
  <text x="80" y="186" fill="#171821" font-family="Inter, PingFang SC, Microsoft YaHei, Arial" font-size="44" font-weight="820">客户端原型</text>
  <text x="80" y="235" fill="#717784" font-family="Inter, PingFang SC, Microsoft YaHei, Arial" font-size="18">改为移动 App 客户端结构，</text>
  <text x="80" y="266" fill="#717784" font-family="Inter, PingFang SC, Microsoft YaHei, Arial" font-size="18">突出进度、记录和复练。</text>

