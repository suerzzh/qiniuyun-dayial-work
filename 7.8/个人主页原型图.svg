    <text class="muted small" x="14" y="254">阶段反馈、复练任务和能力报告。</text>
    <text class="muted tiny" x="14" y="278">专项陪练</text>
    <text class="text h3" x="340" y="278" text-anchor="end">¥199 起</text>
  </g>

  <!-- Feedback and scenarios -->
  <rect class="panel" x="280" y="784" width="342" height="200" rx="8"/>
  <text class="text h2" x="300" y="820">错题本 / 反馈记录</text>
  <line class="line" x1="280" y1="838" x2="622" y2="838"/>
  <rect x="300" y="858" width="302" height="106" rx="8" fill="#ffffff" stroke="#edf0f5"/>
  <rect x="300" y="858" width="4" height="106" fill="#2f5f9f"/>
  <text class="text h3" x="316" y="882">表达自然度：说法偏中式</text>
  <text class="muted small" x="316" y="906">场景：酒店延迟退房。建议复练</text>
  <text class="muted small" x="316" y="926">extend my checkout time / extra charge。</text>
  <text class="green small" x="316" y="952">Could I extend my checkout time?</text>

  <rect class="panel" x="642" y="784" width="352" height="200" rx="8"/>
