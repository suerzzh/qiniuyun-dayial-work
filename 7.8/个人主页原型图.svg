<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 1; }
      .soft { fill: #fbfcfe; stroke: #edf0f5; stroke-width: 1; }
      .ink { fill: #1a1a2e; }
      .text { fill: #262938; font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .muted { fill: #6b7280; font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .white { fill: #ffffff; font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .h1 { font-size: 30px; font-weight: 800; }
      .h2 { font-size: 18px; font-weight: 760; }
      .h3 { font-size: 15px; font-weight: 740; }
      .body { font-size: 13px; font-weight: 500; }
      .small { font-size: 12px; font-weight: 500; }
      .tiny { font-size: 11px; font-weight: 500; }
      .bold { font-weight: 760; }
      .nav { font-size: 14px; font-weight: 680; }
      .metric { font-size: 26px; font-weight: 820; }
      .blue { fill: #2f5f9f; }
      .blue-soft { fill: #eef5ff; }
      .green { fill: #2f7d62; }
      .green-soft { fill: #edf8f4; }
      .orange { fill: #a15c1b; }
      .orange-soft { fill: #fff6ed; }
      .line { stroke: #edf0f5; stroke-width: 1; }
      .bar { fill: #2f5f9f; opacity: .92; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#121828" flood-opacity="0.08"/>
    </filter>
