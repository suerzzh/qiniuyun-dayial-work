schema: spec-driven

context: |
  项目：AI 英语口语陪练 Web Demo。
  当前目标：验证自由对话 Realtime 语音链路跑通。
  规约语言：中文。
  研发优先级：链路跑通 > 调试可见 > UI 精致度。

rules:
  specs:
    - 需求必须是可观察、可验收的行为。
    - 不把评分、纠错、CEFR、发音评测、错题本、登录、会员、录音保存、完整个人主页、复杂学习报告写入本期范围。
    - 涉及不确定供应商能力时，必须在设计文档中明确排除或标注为后续，不留给实现阶段判断。
  design:
    - 本期规约强制采用 Qwen-Omni-Realtime WebSocket 后端代理链路。
    - 本期不实现 WebRTC，不实现豆包适配，不实现 ASR+LLM+TTS 串联兜底。
    - 所有供应商 API Key 只能在后端环境变量中读取。
  tasks:
    - 任务必须可按顺序执行。
    - 每个任务必须有完成判定。
    - 任务不得要求实现者重新选择供应商、协议或功能范围。

